# CI for every PR and for pushes to main (spec 00, criterion "CI").
#
# The Vercel preview link on PRs comes from the Vercel GitHub app, not from this
# file.
#
# ---- WHAT THIS COSTS, AND WHY IT IS SHAPED THIS WAY (10 Nov 2026) ----
#
# Actions bills per JOB and rounds every job UP to the minute, so a job costs a
# minute before it does anything at all. Measured over the 30 days to 10 Nov,
# this workflow ran 140 times at 16 billed minutes a run: roughly 2,240 minutes
# against a 2,000-minute allowance, which is why the account kept warning that
# minutes were running out. Three things follow, and each is a cost decision
# rather than a matter of taste:
#
#   1. There is NO separate "detect" job. It tested for apps/web/package.json
#      in eleven seconds and was billed a full minute for it, 140 times a
#      month. The surface exists now, so the question it asked is settled.
#   2. e2e and Lighthouse run on PULL REQUESTS, not on pushes to main. The
#      constitution frames both as PR gates: Lighthouse "fails a PR that drops
#      performance or accessibility below 90", and a PR "has Playwright
#      screenshots for any page it touched". A push to main is a PR that
#      already passed them, so running again buys nothing.
#   3. The web build happens ONCE. `check` builds it and uploads .next;
#      Lighthouse serves that. Building twice cost two to three minutes a run
#      to produce a byte-identical artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No network from the build beyond the registry: Next.js phones home unless told not to.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Whether this change could move what the site renders. A docs or ADR
      # commit cannot change a Lighthouse score or a screenshot, and eleven
      # minutes is an expensive way to prove that.
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-paths step below diffs against the base branch, which
          # needs its history. The repository is days old, so this is cheap.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Next.js build cache (next/font downloads the faces at build, ADR-020)
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm typecheck
      - run: pnpm --filter db check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Decide whether the rendered site could have changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main has already been through a PR. See note 2 above.
            echo "app=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          # A DENY list on purpose. An allow list would quietly skip the gates
          # for any new source directory nobody remembered to add to it; this
          # way an unrecognised path costs a run, which is the safe failure.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- . \
               ':(exclude)docs/**' \
               ':(exclude)spec/**' \
               ':(exclude)**/*.md' \
             | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the JSON Schema contract
        uses: actions/upload-artifact@v7
        with:
          name: json-schema
          path: packages/schema/dist/json
          if-no-files-found: error

      - name: Upload the built site for Lighthouse to serve
        if: steps.changed.outputs.app == 'true'
        uses: actions/upload-artifact@v7
        with:
          # .next/cache is excluded because it is restored from the Actions
          # cache above; shipping it through an artifact as well would pay for
          # the same bytes twice.
          path: |
            apps/web/.next
            !apps/web/.next/cache
          name: web-build
          if-no-files-found: error
          retention-days: 1
          # .next is a DOTTED directory and upload-artifact skips hidden files by
          # default, so without this the path matches nothing and the error
          # above fires on a build that was in fact fine.
          include-hidden-files: true

  e2e:
    name: Playwright e2e and screenshots
    needs: check
    # `app` is false on a push to main and on a docs-only PR, so this one
    # condition covers both skips.
    if: needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is a ~130 MB download and its version only moves when the
      # lockfile does, so fetch it once per lockfile rather than once per run.
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # @playwright/test is a dependency of apps/web, not of the root.
      - name: Install the browser and its OS libraries
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # The OS libraries live outside the cached directory, so a cache hit
      # still needs them — but install-deps alone is seconds, not a download.
      - name: Install the browser's OS libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report
            apps/web/playwright-report
            packages/ui/__screenshots__
            apps/web/e2e/__screenshots__
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI budgets
    needs: check
    if: needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lighthouserc.json starts the site with `next start`, which needs .next
      # and not a second compile of the same source. See note 3 above.
      - name: Download the site that check built
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
      # Budgets live in lighthouserc.json: performance and accessibility under 90 fail the PR.
      - run: pnpm exec lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          # Dotted, like .next above. This upload has been silently producing
          # nothing: hidden files are skipped by default and if-no-files-found
          # is `ignore`, so there was no error to notice. Pre-existing on main.
          include-hidden-files: true
