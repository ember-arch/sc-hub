# The news pollers (ADR-027, spec 03).
#
# Every two hours workers/poll-news reads RSI's Comm-Link hub (and the Star Citizen Wiki
# API's record of each new Comm-Link) and RSI's roadmap board, and appends what is new to the
# news pack in fixtures/news. When anything changed, the change lands on main as one data commit;
# when nothing did, the run ends with no commit. The unit suite guards the parsers; a source that
# answers with a shape the parsers do not know fails the run and writes nothing. The RSI requests
# need the repository variable SC_HUB_CONTACT_EMAIL (CLAUDE.md section 9). The Spectrum worker
# runs in the same job and does nothing until the repository variable SPECTRUM_MODE is poll (no
# credential: Spectrum's search answers without a sign-in) or feed (with SPECTRUM_FEED_URL); in poll
# mode it then reads the threads of the posts it just collected, up to three, five minutes apart,
# for the posts' own blocks and pictures (ADR-036), which is why the job has twenty minutes.
# What it reads lands in this private repository only; the site shows nothing from Spectrum until
# its own SPECTRUM_MODE is set, once docs/legal/cig-approval.md ticks the box, and whether the
# collection itself needs CIG's word is recorded there as the owner's call.
name: News

on:
  schedule:
    # Every two hours: Actions bills every job up to the minute, a private repository has two
    # thousand minutes a month, and forty-eight runs a day took most of them (ADR-027, amended
    # 2026-11-10 when the owner was warned the minutes were running out). Spec 03's
    # fifteen-minute gate holds once the pollers run on Fly.
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  poll:
    name: Poll the news sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the schema
        run: pnpm --filter schema build
      - name: Poll
        env:
          SC_HUB_CONTACT_EMAIL: ${{ vars.SC_HUB_CONTACT_EMAIL }}
        run: pnpm workers:poll-news
      - name: Poll Spectrum (off until SPECTRUM_MODE is set)
        continue-on-error: true
        env:
          SC_HUB_CONTACT_EMAIL: ${{ vars.SC_HUB_CONTACT_EMAIL }}
          SPECTRUM_MODE: ${{ vars.SPECTRUM_MODE }}
          SPECTRUM_FEED_URL: ${{ vars.SPECTRUM_FEED_URL }}
        run: pnpm workers:poll-spectrum
      - name: Commit what changed
        run: |
          git add fixtures/news fixtures/spectrum/thread-state.json fixtures/spectrum/uploads.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "sc-hub news"
          git config user.email "news@users.noreply.github.com"
          git commit -m "data: news pack, $(date -u +%Y-%m-%dT%H:%MZ) (ADR-027)"
          git pull --rebase origin main
          git push origin HEAD:main
