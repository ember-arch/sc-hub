# The daily refresh (ADR-023).
#
# Runs scripts/refresh/index.ts: the catalog is rebuilt only when the Wiki API serves a new
# build; the ship matrix, loaners, prices, titles and funding counters refresh every day; only
# real changes stay (a new stamp on the same data is reverted). The refreshed fixtures then go
# through the unit suite, the database check and a full build in this job, because a push made
# with the workflow token does not start the CI workflow. When they pass, the changes land on
# main as one data commit; a source that failed gets an issue with its report and, when there
# are changes, a branch. The sources on robertsspaceindustries.com need the repository variable
# SC_HUB_CONTACT_EMAIL (CLAUDE.md section 9); without it they are skipped and an issue says so.
name: Refresh

on:
  schedule:
    # Every day, 06:23 UTC.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild the catalog even if the build is unchanged
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    name: Refresh the fixtures
    runs-on: ubuntu-latest
    # A rebuild is some three thousand requests at the polite limit, about two hours.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter schema build

      - name: Run the fetchers
        id: fetch
        continue-on-error: true
        env:
          SC_HUB_CONTACT_EMAIL: ${{ vars.SC_HUB_CONTACT_EMAIL }}
          REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCE: ${{ inputs.force_rebuild == true && '--force-rebuild' || '' }}
        run: pnpm exec tsx scripts/refresh/index.ts $FORCE --out "$RUNNER_TEMP/refresh"

      - name: Summary
        run: cat "$RUNNER_TEMP/refresh/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Did anything change
        id: changes
        run: |
          if git diff --quiet -- fixtures && [ -z "$(git ls-files --others --exclude-standard fixtures)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- fixtures
          fi

      - name: Check the refreshed fixtures (unit suite, database check, full build)
        id: check
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          pnpm test
          pnpm --filter db check
          pnpm build

      - name: Land the changes on main
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fixtures
          git commit -F "$RUNNER_TEMP/refresh/commit.txt"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"

      - name: Keep the changes on a branch when the checks failed
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day=$(date -u +%Y-%m-%d)
          git switch -c "data/refresh-$day"
          git add -A fixtures
          git commit -F "$RUNNER_TEMP/refresh/commit.txt"
          git push --force origin "data/refresh-$day"
          {
            echo ""
            echo "The refreshed fixtures did not pass the unit suite, the database check or the build; they are on branch data/refresh-$day and did not land."
          } >> "$RUNNER_TEMP/refresh/issue.md"
          if [ ! -s "$RUNNER_TEMP/refresh/issue-title.txt" ]; then
            echo "Refresh needs attention: the checks failed on the refreshed fixtures" > "$RUNNER_TEMP/refresh/issue-title.txt"
            {
              echo "The daily refresh of $day fetched changes that did not pass the unit suite, the database check or the build (ADR-023). They are on branch data/refresh-$day and did not land."
              echo ""
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$RUNNER_TEMP/refresh/issue.md"
          fi

      - name: Open or update the issue for a failure
        if: steps.fetch.outcome != 'success' || (steps.changes.outputs.changed == 'true' && steps.check.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(cat "$RUNNER_TEMP/refresh/issue-title.txt")
          if [ -z "$title" ]; then
            title="Refresh needs attention"
            echo "The daily refresh could not run; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/refresh/issue.md"
          fi
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/refresh/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/refresh/issue.md"
          fi

      - name: Ask for the contact address once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$RUNNER_TEMP/refresh/needs-contact.txt"
          if [ ! -f "$file" ] || [ "$(cat "$file")" != "yes" ]; then exit 0; fi
          title="Refresh: set SC_HUB_CONTACT_EMAIL so RSI's sources refresh"
          existing=$(gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then exit 0; fi
          gh issue create --title "$title" --body "The daily refresh skips the ship matrix, the loaner matrix and the pledge prices because the repository variable SC_HUB_CONTACT_EMAIL is not set (CLAUDE.md section 9: requests to robertsspaceindustries.com carry a contact address, ADR-005). Set it once under Settings, Secrets and variables, Actions, Variables, and the next run refreshes them."

      - name: Fail the run when a source failed
        if: steps.fetch.outcome != 'success'
        run: exit 1
