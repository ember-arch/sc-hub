6qGA5y3CSPR8/tiburon.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/5bb545ae9a3edfe2882b44dfbbc3923d74e62014/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkBztzjFzz9peVL7Tu2tR6qGA5y3CSPR8))/85/tiburon.webp&quot;,&quot;tablet&quot;:&quot;/i/5bb545ae9a3edfe2882b44dfbbc3923d74e62014/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkBztzjFzz9peVL7Tu2tR6qGA5y3CSPR8))/85/tiburon.webp&quot;,&quot;mobile&quot;:&quot;/i/8e230e0f4fd13e8d90b0ff4fb20301a184a91cc9/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkBztzjFzz9peVL7Tu2tR6qGA5y3CSPR8))/85/tiburon.webp&quot;,&quot;max&quot;:&quot;/i/f77813c6e134e0685811e83be7724fae33767a33/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkBztzjFzz9peVL7Tu2tR6qGA5y3CSPR8/tiburon.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Tiburon&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="d215cc74" data-plugin_key="plugin_trblt_features" data-position="17"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Aegis Dynamics</template><template slot="subtitle">Day 8, November 20-21</template><template slot="introduction"><p>Now we're bringing in the big guns. The eighth day of IAE gives you access to the combat-heavy lineup of Aegis Dynamics, the legendary designer of many of the UEE's most lauded military vessels, with a variety of capable ships also available to the civilian market. Here's the full list available on Day 8:</p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/aegis-avenger/Avenger-Stalker" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Avenger Stalker</u></strong></a>&#160;- A modified version of the Avenger catering to bounty hunters thanks to built-in prison cells.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/aegis-avenger/Avenger-Titan" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Avenger Titan</u></strong></a>&#160;- A former Advocacy patrol ship with added cargo capacity for light couriering.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/aegis-avenger/Avenger-Titan-Renegade" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Avenger Titan Renegade</u></strong></a>&#160;- Special-edition of the Avenger Titan with custom livery and a loadout geared to Arena Commander.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/aegis-avenger/Avenger-Warlock" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Avenger Warlock</u></strong></a>&#160;- A variant of the Avenger armed with an EMP generator to humanely disable enemies.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/eclipse/Eclipse" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Eclipse</u></strong></a>&#160;- A sleek stealth bomber armed with heavy torpedoes.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/gladius/Gladius" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Gladius</u></strong></a>&#160;- An aging but agile light-fighter boasting mid-range armament.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/gladius/Gladius-Valiant" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Gladius Valiant</u></strong></a>&#160;- Special-edition Gladius with custom livery and a loadout geared to Arena Commander.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/hammerhead/Hammerhead" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Hammerhead</u></strong></a>&#160;- A multi-crew corvette bristling with manned turrets and heavy firepower.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/reclaimer/Reclaimer" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Reclaimer</u></strong></a>&#160;- A vast deep-space salvage vessel built to reclaim wrecks and derelict ships.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/redeemer/Redeemer" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Redeemer</u></strong></a>&#160;- Dotted with turrets and missiles, the Aegis Redeemer is a powerful fighting gunship capable of holding its own in combat with an impressive weapons payload.&#160;</li><li><a href="https://robertsspaceindustries.com/pledge/ships/aegis-retaliator/Retaliator" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Retaliator</u></strong></a>&#160;- One of Humanity’s most powerful warbirds, the Retaliator is a fearsome weapons platform originally designed to strike and kill capital ships.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/sabre/Sabre" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Sabre</u></strong></a>&#160;- Favoring agility over durability, the Sabre is light, sleek, and deadly.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/sabre/Sabre-Comet" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Sabre Comet</u></strong></a>&#160;- Special-edition of the Sabre with custom livery and a loadout geared to Arena Commander.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/sabre/Sabre-Firebird" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Sabre Firebird</u></strong></a>&#160;- Facilitating a devastating marriage of speed and ballistic firepower, the Firebird brings the heat to the infamous Sabre chassis.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/sabre/Sabre-Peregrine" rel="noopener noreferrer" target="_blank"><strong>Aegis Sabre Peregrine</strong></a>&#160;- The fastest Sabre model yet conceived, the Peregrine takes the infamous military-born chassis and tunes it for pure unadulterated speed.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/sabre/Sabre-Raven-EX" rel="noopener noreferrer" target="_blank"><strong>Aegis Sabre Raven EX</strong></a> - Built on a legacy of space superiority, the Aegis Sabre Raven EX matches the firepower of the Sabre, the silhouette of the Raven, and adds a quantum dampener to isolate enemies and keep them in the line of fire.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/tiburon/Tiburon" rel="noopener noreferrer" target="_blank"><strong>Aegis Tiburon</strong></a> - Conceived to rip capital ships from the sky, the Aegis Tiburon is built to destroy. Defined by a huge central laser beam, it takes a whole crew to handle, but the results are more than worth the effort.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/vanguard/Vanguard-Harbinger" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Vanguard Harbinger</u></strong></a>&#160;- A powerful bomber that can operate out of the roughest forward-operating bases.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/vanguard/Vanguard-Hoplite" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Vanguard Hoplite</u></strong></a>&#160;- Long-range squad dropship with a manned turret for protection.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/vanguard/Vanguard-Sentinel" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Vanguard Sentinel</u></strong></a>&#160;- A ship designed to fight smart instead of taking enemies head-on.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/vanguard/Vanguard-Warden" rel="noopener noreferrer" target="_blank"><strong><u>Aegis Vanguard Warden</u></strong></a>&#160;- One of Aegis' most versatile and deadly long-range fighters. With an extra heavy frame, and an extra nasty loadout.</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="a0cd41de" data-plugin_key="plugin_trblt_banner_advanced" data-position="18"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/91e41b62ca3f8cb6d58a614d6d020a9164e4f077/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.png&quot;,&quot;tablet&quot;:&quot;/i/44c2f864710ee3f17624b56d48789323b6c66731/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.png&quot;,&quot;mobile&quot;:&quot;/i/def481719e6e4b025c36d822f97b9e73c10d0fd4/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.png&quot;,&quot;max&quot;:&quot;/i/b3481a588d6aeb4f4b2f450535686a45406814e0/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6/railen2026.png&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/91e41b62ca3f8cb6d58a614d6d020a9164e4f077/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;tablet&quot;:&quot;/i/44c2f864710ee3f17624b56d48789323b6c66731/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;mobile&quot;:&quot;/i/def481719e6e4b025c36d822f97b9e73c10d0fd4/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;max&quot;:&quot;/i/b3481a588d6aeb4f4b2f450535686a45406814e0/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6/railen2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/7e11ceb3fd56365ab74b2e42df21c02de6e03445/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;tablet&quot;:&quot;/i/7e11ceb3fd56365ab74b2e42df21c02de6e03445/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;mobile&quot;:&quot;/i/15246ca897bbf18d36568df6f3c2a194385d9fea/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6))/85/railen2026.webp&quot;,&quot;max&quot;:&quot;/i/b3481a588d6aeb4f4b2f450535686a45406814e0/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiw3zQ1ZfVqYjVtbPSgHCMLRQzJzYgbn6/railen2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Railen2026&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="dcaa0d02" data-plugin_key="plugin_trblt_features" data-position="19"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Aopoa, Banu, Esperia, Gatac</template><template slot="subtitle">Day 9, November 21-22</template><template slot="introduction"><p>Ready to change things up? The expansive lineup of alien ship designs is yours to peruse at IAE. Explore offerings inspired by Xi'an, Banu, Tevarin, and even Vanduul technology, customized for the civilian Human market. Visit IAE on Day 9:</p><p><strong>AOPOA</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/khartu/Khartu-Al" rel="noopener noreferrer" target="_blank"><strong><u>Aopoa Khartu-al</u></strong></a>&#160;- Enigmatic, exotic, and agile. The fragile Khartu-al excels at lateral thrust and maneuverability.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/nox/Nox" rel="noopener noreferrer" target="_blank"><strong><u>Aopoa Nox</u></strong></a>&#160;- Sleek and fast, this gravity bike glides across rough terrain. Perfect for scouting and racing.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/aopoa-santokyai/santoky-i" rel="noopener noreferrer" target="_blank"><strong>Aopoa San'tok.yāi</strong></a> - Meet the next evolution of Xi'an tech and design innovation. The San’tok.yāi is a fighter that literally flies circles around the competition.</li></ul><p><strong>BANU</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/defender/defender" rel="noopener noreferrer" target="_blank"><strong><u>Banu Defender</u></strong></a>&#160;- The exotic fighter is the first line of defense against enemy attack.</li></ul><p><strong>ESPERIA</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/vanduul-blade/Blade" rel="noopener noreferrer" target="_blank"><strong><u>Esperia Blade</u></strong></a>&#160;- This alien fighter slices through the air with high agility to shred foes to ribbons.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/esperia-glaive/Glaive" rel="noopener noreferrer" target="_blank"><strong><u>Esperia Glaive</u></strong></a>&#160;- This medium alien fighter replica drives fear with its impressive armament.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/prowler/Prowler" rel="noopener noreferrer" target="_blank"><strong><u>Esperia Prowler</u></strong></a>&#160;- The Prowler is a modernized version of the infamous Tevarin armored personnel carrier.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/prowler/Prowler-Utility" rel="noopener noreferrer" target="_blank"><strong>Esperia Prowler Utility</strong></a> - The Utility embraces the alien design of the infamous Tevarin ship entrusted to Esperia decades ago. However, its 32-SCU cargo hold and integrated tractor beam make this variant as practical for hauling as it is visually striking.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/stinger/Stinger" rel="noopener noreferrer" target="_blank"><strong>Esperia Stinger</strong></a> - A closely replicated Vanduul ship, reworked for Human flight. As Esperia’s first Heavy Fighter, the Stinger prioritizes strong armor to sustain prolonged barrages while readying its attack.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/talon/Talon" rel="noopener noreferrer" target="_blank"><strong><u>Esperia Talon</u></strong></a>&#160;- The Talon is the Tevarin equivalent to the Aegis Gladius or Vanduul Blade; a single-seat combat ship.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/talon/Talon-Shrike" rel="noopener noreferrer" target="_blank"><strong><u>Esperia Talon Shrike</u></strong></a>&#160;- The infamous Shrike variant is armed with authentic internal missile racks capable of unleashing lethal barrages of projectiles.</li></ul><p><strong>GATAC MANUFACTURE</strong></p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/railen/Railen" rel="noopener noreferrer" target="_blank"><strong>Gatac Railen</strong></a> - An elegant interspecies vessel perfect for any Human or Xi’an pilot looking for a safe, reliable solution for commercial-grade medium cargo hauling. With cutting-edge technology and time-tested designs, the Railen gives protection when needed, defenses when necessary, and innovation always.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/syulen/Syulen" rel="noopener noreferrer" target="_blank"><strong>Gatac Syulen</strong></a> - The Syulen cargo vessel has been artfully crafted by the renowned House Gatac to perfectly suit both Human and Xi'an pilots.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/tyilui/Tyilui" rel="noopener noreferrer" target="_blank"><strong>Gatac Tyilui</strong></a> - Effortlessly navigate the multi-directional zero-gravity hangar in Gatac’s first carrier craft. Missiles, pilot weapons, and turrets create a daunting deterrent as you deploy Snub Fighters into conflict zones, while additional cargo space supports rearming, refueling, and repair in combat.&#160;</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="3a7893f2" data-plugin_key="plugin_trblt_banner_advanced" data-position="20"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/34accc22a1bc7e44c8da3efb4424cd69decadd70/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjZkmCN46wp75yQwUU7dZjb5YuUzBHxmot))/85/perseus2026.png&quot;,&quot;tablet&quot;:&quot;/i/410e905f8635c99fa1847f8e6d9245fbabe4334a/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjZkmCN46wp75yQwUU7dZjb5YuUzBHxmot))/85/perseus2026.png&quot;,&quot;mobile&quot;:&quot;/i/4f52e112c859f4263a4983587ddb0fbc1a063982/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjZkmCN46wp75yQwUU7dZjb5YuUzBHxmot))/85/perseus2026.png&quot;,&quot;max&quot;:&quot;/i/a1265ef8f2ca24fe0839db3b272287262dc1c617/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjZkmCN46wp75yQwUU7dZjb5YuUzBHxmot/perseus2026.png&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/34accc22a1bc7e44c8da3 ><div data-arrangement_key="arrangementC" class="turbo-anchor" id="01fde8c5" data-plugin_key="plugin_trblt_features" data-position="21"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="false" :is-header-declared="true" v-cloak=""><template slot="title">Best In Show</template><template slot="subtitle">Day 10, November 22</template><template slot="introduction"><p>Over the summer, we held our annual&#160;<a href="https://robertsspaceindustries.com/en/ship-showdown-2956/live-showdown" rel="noopener noreferrer" target="_blank"><strong>Ship Showdown</strong></a> contest to uncover the community’s favorite flyable ship of 2026.</p><p>After a tense battle, the RSI Perseus took home the title, with the Drake Ironclad Assault, Drake Corsair, and Origin M80 finishing close behind.&#160;</p><p>To celebrate the final four ships, the Best in Show day lets you test-fly each finalist. Furthermore, those who have one (or more) of the four ships that made it to the Semi-Finals will get a free limited-edition ship livery!</p><p>Additionally, all previously available flyable ships will also be ready to test-fly via the rental kiosks&#160;located at the Tobin Expo Center.</p></template></g-features><div data-arrangement_key="arrangementA" class="turbo-anchor" id="19d24114" data-plugin_key="plugin_trblt_features" data-position="22"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementA" :is-image-action-declared="false" :is-header-declared="false" v-cloak=""><template slot="overline">Elevator</template><template slot="title">Nitrogen radar</template><template slot="subtitle">Staggering</template><template slot="introduction"><p>The Entity shall act as a political neutral zone where representatives can meet to resolve problems through discourse Known locally as Pinecone, this Nitrogen-rich Chthonian Planet is situated on the further edge of the green band and is often overlooked when compared to Kellog V  We know that we have been Cruel</p></template><g-feature :has-video="false" :cta-open-in-new-tab="false" arrangement="arrangementA" :is-image-action-declared="false" :picture="{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/d51d7567e1d19d1718a11dce1aeab2be8919e850/resize(3000,1286,cover,crop(3840,1645,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.jpg&quot;,&quot;tablet&quot;:&quot;/i/7f917095fecc40447d834c7a752674e9bdb202e0/resize(1500,643,cover,crop(3840,1645,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.jpg&quot;,&quot;mobile&quot;:&quot;/i/dd91f36db8dee78bd0965a41b9ab540b88de351f/resize(1000,1001,cover,crop(1646,1646,0,1097,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.jpg&quot;,&quot;max&quot;:&quot;/i/2db7c95e30cdc86bf6d516ff052d4b759a575147/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg/sc-iae2026-communityhub.jpg&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/d51d7567e1d19d1718a11dce1aeab2be8919e850/resize(3000,1286,cover,crop(3840,1645,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.webp&quot;,&quot;tablet&quot;:&quot;/i/7f917095fecc40447d834c7a752674e9bdb202e0/resize(1500,643,cover,crop(3840,1645,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.webp&quot;,&quot;mobile&quot;:&quot;/i/dd91f36db8dee78bd0965a41b9ab540b88de351f/resize(1000,1001,cover,crop(1646,1646,0,1097,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResj6737R84FAMrw4cHBsT1L18UTZzjWMmHg))/85/sc-iae2026-communityhub.webp&quot;,&quot;max&quot;:&quot;/i/2db7c95e30cdc86bf6d516ff05
