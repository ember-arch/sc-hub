layed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementA" class="turbo-anchor" id="edf07ce3-a764-4ceb-8f14-c27af95aa1ce" data-plugin_key="plugin_trblt_introduction" data-position="1"></div><g-introduction :background-options="{&quot;isTransparent&quot;:true}" :info="{&quot;overline&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;contents&quot;:[&quot;<p>Join us in New Babbage<strong> </strong>on microTech, system Stanton, for the biggest spaceship show in the universe! To celebrate the <a href=\&quot;https://robertsspaceindustries.com/en/comm-link/transmission/21389-Countdown-To-IAE-2956\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><strong>2956 <u>Intergalactic Aerospace Expo</u></strong></a>, Star Citizen will be <strong>FREE TO PLAY</strong> throughout the entire event.</p><p>From November 13 - 27, you have the chance to try some of Star Citizen's most iconic vehicles for free. All you have to do is to&nbsp;<a href=\&quot;https://robertsspaceindustries.com/enlist\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><u>create an account</u></a>,&nbsp;<a href=\&quot;https://robertsspaceindustries.com/download\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><u>download the game</u></a>&nbsp;and&nbsp;<a href=\&quot;https://robertsspaceindustries.com/playstarcitizen\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><u>jump into the fun</u></a>.</p><p><strong>Here's how it works:</strong></p><p>During the Intergalactic Aerospace Expo, anyone can explore Star Citizen's Persistent Universe for free. Even if you don't have a Star Citizen Game Package, you can try it for free and fly to the in-game event in style with RSI's Aurora Mk II, available to everyone throughout IAE. Find an ASOP terminal, claim a ship from the available options, then chart a course for microTech in the Stanton system.</p><p>The event lands in <strong>New Babbage on microTech</strong> on November 13, 16:00 UTC. Explore the vast expo halls, check out the latest ships and classic vehicles from top manufacturers, and take them out for a spin. New reveals and surprises will debut throughout the event, with free rental access unlocking each day according to the manufacturer schedule.</p><p>Check out the schedule below to plan your test flights, and stay up to date with our <a href=\&quot;https://robertsspaceindustries.us5.list-manage.com/subscribe?u=32d8ef31243db6075c45571bd&amp;id=311b8ae75e\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>IAE newsletter</a>! Sign up to receive the latest updates straight to your inbox with news, event highlights, and surprises from the show floor. Got questions? Head over to Spectrum and browse the <a href=\&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/1/thread/iae-2956-faq-choose-your-adventure\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>IAE 2956 FAQ</a>.</p>&quot;]}" arrangement="arrangementA" v-cloak="" img-alt="" img-url=""></g-introduction><div data-arrangement_key="full-width" class="turbo-anchor" id="c4851428" data-plugin_key="plugin_trblt_banner_advanced" data-position="2"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/981bdf891f7ebc47922161012de0288432ae1c9a/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.png&quot;,&quot;tablet&quot;:&quot;/i/5eaaa27a5252b7917fd97fea6f05f182b592d2b8/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.png&quot;,&quot;mobile&quot;:&quot;/i/b044aa04c3926600baf8bc0c75f933756204805d/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.png&quot;,&quot;max&quot;:&quot;/i/40b504df667ade493b131d6fb6ca866b36c8efa2/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx/galaxy2026.png&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/981bdf891f7ebc47922161012de0288432ae1c9a/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;tablet&quot;:&quot;/i/5eaaa27a5252b7917fd97fea6f05f182b592d2b8/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;mobile&quot;:&quot;/i/b044aa04c3926600baf8bc0c75f933756204805d/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;max&quot;:&quot;/i/40b504df667ade493b131d6fb6ca866b36c8efa2/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx/galaxy2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/ddcfcb76e3bf584e9917accc7d875e3cd392cf7a/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;tablet&quot;:&quot;/i/ddcfcb76e3bf584e9917accc7d875e3cd392cf7a/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;mobile&quot;:&quot;/i/67f098167026410cbd127e162f05352ce06e467e/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx))/85/galaxy2026.webp&quot;,&quot;max&quot;:&quot;/i/40b504df667ade493b131d6fb6ca866b36c8efa2/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResk1qmiT16MRxVjwP5YSRSpHGYUJDXwKgBx/galaxy2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Galaxy2026&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementA" class="turbo-anchor" id="5e70afd4" data-plugin_key="plugin_trblt_features" data-position="3"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementA" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Roberts Space Industries</template><template slot="subtitle">Day 1, November 13-14</template><template slot="introduction"><p>The Galaxy arrives at last, casting a massive shadow over the Expo hall with its flyable debut! This modular marvel is built for versatility and ready to tackle the toughest cargo, medical, and refining operations while holding its own in combat. Don't miss your chance to give the Galaxy a try, and see the rest of&#160;RSI’s lineup on Day 1 of IAE:</p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/galaxy/Galaxy" rel="noopener noreferrer" target="_blank"><strong>RSI Galaxy</strong></a> - With a fully modular design and an onboard hangar capable of deploying small ships, the cutting-edge Galaxy can be outfitted with comprehensive facilities to support cargo, medical, or refining operations.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/skylark/Skylark" rel="noopener noreferrer" target="_blank"><strong>RSI Skylark</strong></a> - Armed for attack, shielded for safety, and fueled for the frontier, the Skylark is a snub fighter built with everyday adventure in mind.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-apollo/Apollo-Medivac" rel="noopener noreferrer" target="_blank"><strong>RSI Apollo Medivac</strong></a> - A life-saving ship with enhanced armor and missile racks, capable of responding to calls in the heaviest combat.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-apollo/Apollo-Triage" rel="noopener noreferrer" target="_blank"><strong>RSI Apollo Triage</strong></a> - The Triage delivers highly configurable, professional-level medical care anywhere in the galaxy.</li><li><a href="https://robertsspaceindustries.com/en/pledge/Standalone-Ships/Aurora-Mk-II" rel="noopener noreferrer" target="_blank"><strong>RSI Aurora Mk II</strong></a> - The next generation in accessible spacecraft. With retractable wings and a modular chassis supporting cargo, combat, and more, the RSI Aurora Mk II is the ultimate way to start a life in the ‘verse.</li><li><a href="https://robertsspaceindustries.com/en/pledge/Standalone-Ships/Constellation-Mk-V-Centaurus-10-Year" rel="noopener noreferrer" target="_blank"><strong>RSI Constellation Mk V Centaurus</strong></a> - A legend reborn for the modern era. The RSI Constellation Mk V Centaurus combines heavy weaponry, a sizable cargo capacity, and an on-board snub fighter, allowing you to tackle any challenge, anywhere in the galaxy.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-constellation/Constellation-Mk-IV-Andromeda" rel="noopener noreferrer" target="_blank"><strong>RSI Constellation Mk IV Andromeda</strong></a> - The Constellation Mk IV Andromeda, a multi-person freighter, is beloved by smugglers and merchants alike for its modular flexibility, potent firepower, and iconic looks.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-constellation/Constellation-Mk-IV-Aquila" rel="noopener noreferrer" target="_blank"><strong>RSI Constellation Mk IV Aquila</strong></a> - Sporting a redesigned cockpit for maximum visibility, advanced sensors, and an onboard Ursa rover for planetary exploration, the Constellation Mk IV Aquila is ready for adventure.&#160;</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-constellation/Constellation-Mk-IV-Phoenix" rel="noopener noreferrer" target="_blank"><strong>RSI Constellation Mk IV Phoenix</strong></a> - Operable as an organization command ship or dedicated luxury spacecraft for the discerning star captain, the Constellation Mark IV Phoenix comes with a Lynx rover and a Kruger P-72 Archimedes Fighter.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-constellation/Constellation-Mk-IV-Taurus" rel="noopener noreferrer" target="_blank"><strong>RSI Constellation Mk IV Taurus</strong></a> - A dedicated freighter including a shielded cargo hold and an industrial-grade tractor beam, the Constellation Mk IV Taurus is a great way to start your hauling empire.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/hermes/Hermes" rel="noopener noreferrer" target="_blank"><strong>RSI Hermes</strong></a> - High capacity, high speed, and high defense. The Hermes delivers standout performance in the ever-competitive medium hauling market.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/ursa/Lynx" rel="noopener noreferrer" target="_blank"><strong>RSI Lynx</strong></a>&#160;- Tour the wildest corners of the ‘verse in safety, comfort, and style in the Lynx from RSI.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/rsi-mantis/Mantis" rel="noopener noreferrer" target="_blank"><strong><u>RSI Mantis</u></strong></a>&#160;- Stop ships dead in their tracks with RSI’s premier quantum enforcer.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/rsi-meteor/Meteor" rel="noopener noreferrer" target="_blank"><strong>RSI Meteor</strong></a> - A medium fighter providing a devastating mix of speed and firepower wrapped in the aggressive styling the brand is known for.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/perseus/Perseus" rel="noopener noreferrer" target="_blank"><strong>RSI Perseus</strong></a> - Capable of shredding sub-capital class goliaths, the mere presence of a Perseus gunship in a blockade or patrol squad is enough to make your most aggressive enemies think twice before engaging, just like its vintage namesake.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/polaris/Polaris" rel="noopener noreferrer" target="_blank"><strong>RSI Polaris</strong></a> - The Polaris is a nimble corvette-class capital ship that packs a powerful punch with a full armament of turrets and torpedoes.</li><li><a href="https://robertsspaceindustries.com/en/pledge/Standalone-Ships/Salvation" rel="noopener noreferrer" target="_blank"><strong>RSI Salvation</strong></a> - With beginner-friendly functionality and a back-to-basics interior, the Salvation brings exactly that to those dreaming of finding their tomorrow in yesterday’s wrecks.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/scorpius/Scorpius" rel="noopener noreferrer" target="_blank"><strong>RSI Scorpius</strong></a>&#160;- With an adaptable bi-wing configuration and revolutionary rail-mounted remote turret, the Scorpius offers unprecedented fire coverage, allowing for both defensive and assault-minded applications.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/scorpius/Scorpius-Antares" rel="noopener noreferrer" target="_blank"><strong>RSI Scorpius Antares</strong></a>&#160;- Redesigned to house a devastating EMP device and quantum jammer, the Antares shuts down enemy combatants, leaving them open to attack or boarding.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/ursa/ursa" rel="noopener noreferrer" target="_blank"><strong><u>RSI Ursa</u></strong></a>&#160;- Rugged, durable, and tough, this is the rover of choice for extreme planetary exploration.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/ursa/Ursa-Medivac" rel="noopener noreferrer" target="_blank"><strong><u>RSI Ursa Medivac</u></strong></a>&#160;- Provides frontline medical support essential to any ground operation.&#160;</li><li><a href="https://robertsspaceindustries.com/pledge/ships/zeus-mk-ii/Zeus-Mk-II-CL" rel="noopener noreferrer" target="_blank"><strong>RSI Zeus Mk II CL</strong></a> - With a focus on commerce, the Zeus Mk II CL features additional cargo space and a tractor beam for handling large volumes of freight.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/zeus-mk-ii/zeus-mk-ii-es" rel="noopener noreferrer" target="_blank"><strong>RSI Zeus Mk II ES</strong></a> - With a focus on exploration, the Zeus Mk II ES features a robust radar package for making new discoveries along with enhanced weaponry and shielding.</li></ul></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="24628cc4" data-plugin_key="plugin_trblt_banner_advanced" data-position="4"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/cde99fc1d0919f5f5e5f691bfa625d1a7edb97f0/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.png&quot;,&quot;tablet&quot;:&quot;/i/6d28015b7d7986293db2852d3c675d6dc66c58a9/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.png&quot;,&quot;mobile&quot;:&quot;/i/c8322959fea4cad5ce49aec32643c37d861e823f/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.png&quot;,&quot;max&quot;:&quot;/i/9a932893b808280a317261ca6cf3499d83e8a81b/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk/m80.png&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/cde99fc1d0919f5f5e5f691bfa625d1a7edb97f0/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;tablet&quot;:&quot;/i/6d28015b7d7986293db2852d3c675d6dc66c58a9/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;mobile&quot;:&quot;/i/c8322959fea4cad5ce49aec32643c37d861e823f/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;max&quot;:&quot;/i/9a932893b808280a317261ca6cf3499d83e8a81b/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk/m80.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/bc883c3df1bdd66facf9f62ab8111c94376e41d8/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;tablet&quot;:&quot;/i/bc883c3df1bdd66facf9f62ab8111c94376e41d8/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;mobile&quot;:&quot;/i/217297a8da92b02b5f3a3a02d5eaf403d70fff4c/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk))/85/m80.webp&quot;,&quot;max&quot;:&quot;/i/9a932893b808280a317261ca6cf3499d83e8a81b/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResepmFM1VmMimrWyTmYY55Z4UKGTC3WPjKk/m80.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;M80&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="c16d4928" data-plugin_key="plugin_trblt_features" data-position="5"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Origin Jumpworks</template><template slot="subtitle">Day 2, November 14-15</template><template slot="introduction"><p>Your IAE journey continues on a more refined route as Origin lights the path. From the devastating allure of its deadly M80 to the sprawling excess of the 890 Jump super-yacht, Origin tailors a craft to suit any role. Here are their offerings for Day 2:</p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/85x/85X" rel="noopener noreferrer" target="_blank"><strong><u>Origin 85x</u></strong></a>&#160;- A luxury and sporty short-range runabout for pilot and passenger.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-100/100i" rel="noopener noreferrer" target="_blank"><strong><u>Origin 100i</u></strong></a>&#160;- Tour the universe with the perfect coupling of luxury and performance.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-100/125a" rel="noopener noreferrer" target="_blank"><strong><u>Origin 125a</u></strong></a>&#160;- With high fuel economy, a souped-up weapons package, and trademark Origin refinement, the 125a is the ideal entry into luxury spaceflight.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-100/135c" rel="noopener noreferrer" target="_blank"><strong><u>Origin 135c</u></strong></a>&#160;- With a deceptive amount of storage space in its sleek, stylish frame, the 135c is the obvious choice for the hauler of taste.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-300/300i" rel="noopener noreferrer" target="_blank"><strong><u>Origin 300i</u></strong></a>&#160;- Travel in style with this high-performance solo tourer.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-300/315p" rel="noopener noreferrer" target="_blank"><strong><u>Origin 315p</u></strong></a>&#160;- Traverse the ‘verse with this high-performance light explorer.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-300/325a" rel="noopener noreferrer" target="_blank"><strong><u>Origin 325a</u></strong></a>&#160;- Origin’s sleek signature fighter, the 325a makes a great companion for finding your mark in style and sophistication.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-300/350r" rel="noopener noreferrer" target="_blank"><strong><u>Origin 350r</u></strong></a>&#160;- Origin’s signature racer, the 350r leaves the competition in the dust.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/400i/400i" rel="noopener noreferrer" target="_blank"><strong><u>Origin 400i</u></strong></a>&#160;- To explore the stars is a most noble endeavor, and Origin Jumpworks has risen to the occasion in crafting the 400i, the ultimate high-performance pathfinder.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/600i/600i-Explorer" rel="noopener noreferrer" target="_blank"><strong>Origin 600i Explorer</strong></a>&#160;- The 600i Explorer swaps the lounge for a robust scanning station as well as additional utility hardpoints to increase the ship's effectiveness.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/600i/600i-Touring" rel="noopener noreferrer" target="_blank"><strong><u>Origin 600i Touring</u></strong></a>&#160;- Star Citizen’s iconic luxury tourer.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/890-jump/890-Jump" rel="noopener noreferrer" target="_blank"><strong><u>Origin 890 Jump</u></strong></a>&#160;- A vessel in a class all of its own, the colossal 890 Jump is a masterpiece of long-distance touring.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/origin-m50/M50" rel="noopener noreferrer" target="_blank"><strong><u>Origin M50</u></strong></a>&#160;- Origin’s premier racer. Small, fast, and highly agile.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/m80/M80" rel="noopener noreferrer" target="_blank"><strong>Origin M80</strong></a> - Beauty and power combine to create a Heavy Fighter far more than mere machine. Powerful weapons, high durability, and genre-defying design ensure the Origin M80 stands tall against anything out there.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/x1/x1" rel="noopener noreferrer" target="_blank"><strong>Origin X1</strong></a> - The X1 takes speed and agility to the next level thanks to seamlessly integrated engine technology and joint vector thruster placement.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/x1/x1-force" rel="noopener noreferrer" target="_blank"><strong>Origin X1 Force</strong></a> - This open-canopy vehicle from Origin is equally suited to ground-based exploration, reconnaissance expeditions, and security operations.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/x1/X1-Velocity" rel="noopener noreferrer" target="_blank"><strong>Origin X1 Velocity</strong></a> - The X1 Velocity offers a lighter chassis to improve overall performance, making it a dangerous new addition to the open-canopy racer lineup.</li></ul></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="59cade73" data-plugin_key="plugin_trblt_banner_advanced" data-position="6"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/33e50a3775c3a4c847a9a5137103efebacc1a1b9/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjUG7C7nzuhBVMtBy t;/i/a1f10cf87220598f6305ce10c0b5e1851666c3e8/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjUG7C7nzuhBVMtByegDgVm1CwfQsCYGDC))/85/carrack2026.webp&quot;,&quot;mobile&quot;:&quot;/i/c9086852f84708678cccd5b3c0ec727ffca8b7d2/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjUG7C7nzuhBVMtByegDgVm1CwfQsCYGDC))/85/carrack2026.webp&quot;,&quot;max&quot;:&quot;/i/d583b10c9254b07df4eef31650a56f35a2fb7788/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjUG7C7nzuhBVMtByegDgVm1CwfQsCYGDC/carrack2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Carrack2026&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="29e760ee" data-plugin_key="plugin_trblt_features" data-position="7"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Anvil Aerospace</template><template slot="subtitle">Day 3, November 15-16</template><template slot="introduction"><p>Day 3 plays host to Anvil's legendary stable of combat-tested ships. From the storied F8C Lightning and F7C Hornet Mk II that form the tip of the UEE Navy's spear to vehicles that support medical and ground-based operations throughout the 'verse, Anvil Aerospace is always up to the task. Here's the lineup for Day 3:</p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-arrow/Arrow" rel="noopener noreferrer" target="_blank"><strong>Anvil Arrow</strong></a>&#160;- Featuring an ultra-aerodynamic frame and slight profile, it’s the most agile ship in its class.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/anvil-asgard/Asgard" rel="noopener noreferrer" target="_blank"><strong>Anvil Asgard</strong></a> - A heavily armored vehicle-dropship equipped for boundless resilience in the hottest combat zones. Power through relentless fire to deliver vital reinforcements, hold the front line, and keep the enemy retreating.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-ballista/Ballista" rel="noopener noreferrer" target="_blank"><strong>Anvil Ballista</strong></a>&#160;- This self-propelled air defense system is capable of destruction on a massive scale.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-pisces/C8R-Pisces" rel="noopener noreferrer" target="_blank"><strong>Anvil C8R Pisces</strong></a>&#160;- With the addition of an onboard Tier 3 Medical Bed, the C8R Pisces can treat minor injuries and keep a patient stable while transporting them to safety.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-pisces/C8X-Pisces-Expedition" rel="noopener noreferrer" target="_blank"><strong>Anvil C8X Pisces Expedition</strong></a>&#160;- Ideal for inter-system travel or investigating tight spots inaccessible to larger ships, it’s a small ship ready for big adventures.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/carrack/Carrack" rel="noopener noreferrer" target="_blank"><strong>Anvil Carrack</strong></a>&#160;- Iconic multi-crew explorer ready for your next epic adventure.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/centurion/Centurion" rel="noopener noreferrer" target="_blank"><strong>Anvil Centurion</strong></a>&#160;- Built on Anvil’s popular Atlas Platform, the Centurion presents a tactical solution for short-range anti-aircraft engagement.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-hornet-mkii/F7C-Hornet-Mk-II" rel="noopener noreferrer" target="_blank"><strong>Anvil F7C Hornet Mk II</strong></a> - Tame the power, speed, and offensive punch of the UEE Navy's premier carrier-based fighter, made famous by its dominating role in the Vanduul war.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/anvil-hornet-mkii/F7C-M-Super-Hornet-Mk-II" rel="noopener noreferrer" target="_blank"><strong>Anvil F7C-M Super Hornet Mk II</strong></a> - The Super Hornet is back and upgraded to Mk II spec, making it deadlier than ever. The only Hornet model with two seats, it features a dedicated gunner’s turret for increased firepower, accuracy, and all-round combat proficiency.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-hornet-mkii/F7C-R-Hornet-Tracker-Mk-II" rel="noopener noreferrer" target="_blank"><strong>Anvil F7C-R Hornet Tracker Mk II</strong></a> - The&#160;F7CR&#160;“Tracker” model is a formidable stalker equipped with supercharged long-range radar.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-hornet-mkii/F7C-S-Hornet-Ghost-Mk-II" rel="noopener noreferrer" target="_blank"><strong>Anvil F7C-S Hornet Ghost Mk II</strong></a> - The F7CS “Ghost” model is a stealth fighter more than capable of both reconnaissance and ambush operations.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/lightning/f8c-lightning" rel="noopener noreferrer" target="_blank"><strong>Anvil F8C Lightning</strong></a> - A force to be reckoned with, it has protected Humanity countless times from countless threats at home and far from civilization.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-gladiator/Gladiator" rel="noopener noreferrer" target="_blank"><strong>Anvil Gladiator</strong></a>&#160;- A ruggedly built two-person dive bomber.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/hawk/Hawk" rel="noopener noreferrer" target="_blank"><strong>Anvil Hawk</strong></a>&#160;- The perfect ship for independent bounty hunters or local security.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/hurricane/Hurricane" rel="noopener noreferrer" target="_blank"><strong>Anvil Hurricane</strong></a>&#160;- A heavy fighter with an almost excessive loadout. Includes a turret that punches through shields and defenses.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/paladin/Paladin" rel="noopener noreferrer" target="_blank"><strong>Anvil Paladin</strong></a> - A formidable gunship with durable armor and immense firepower. Capable of hitting multiple targets simultaneously, the missiles, side turrets, and moveable central turret provide almost complete coverage as you lead the charge against enemies of the Empire.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/spartan/Spartan" rel="noopener noreferrer" target="_blank"><strong>Anvil Spartan</strong></a>&#160;- Ready for any battlefield, this vehicle gets troops there safely, quickly, and effectively.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/terrapin/Terrapin" rel="noopener noreferrer" target="_blank"><strong>Anvil Terrapin</strong></a>&#160;- Heavily armored ship with a sophisticated scanner. Ideal for recon and exploration.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/terrapin/Terrapin-Medic" rel="noopener noreferrer" target="_blank"><strong>Anvil Terrapin&#160;Medic</strong></a> - Sporting the same robust frame and armor as its pathfinding predecessor, the Terrapin Medic adds a Tier 2 MedBed to become a true miniature frontline trauma center or robust search and rescue vessel.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/anvil-valkyrie/Valkyrie" rel="noopener noreferrer" target="_blank"><strong>Anvil Valkyrie</strong></a>&#160;- A heavily armed dropship perfect for full-crew expeditions.</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="79f26331" data-plugin_key="plugin_trblt_banner_advanced" data-position="8"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot; d5a/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiqDCP6uC4mVubmodMd8LiXBD3A6Veru4r))/85/hercules.webp&quot;,&quot;tablet&quot;:&quot;/i/8978281673ac4b85074d7c02129d8f8d490b3d5a/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiqDCP6uC4mVubmodMd8LiXBD3A6Veru4r))/85/hercules.webp&quot;,&quot;mobile&quot;:&quot;/i/e3f4d112d630680382f5a9ad7f2d81f97ec92429/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiqDCP6uC4mVubmodMd8LiXBD3A6Veru4r))/85/hercules.webp&quot;,&quot;max&quot;:&quot;/i/48449a7f2d043692dd51a95ee721f114ed7f5fcc/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiqDCP6uC4mVubmodMd8LiXBD3A6Veru4r/hercules.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Hercules&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementA" class="turbo-anchor" id="73ef117b" data-plugin_key="plugin_trblt_features" data-position="9"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementA" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Crusader Industries, Tumbril</template><template slot="subtitle">Day 4, November 16-17</template><template slot="introduction"><p>Hailing from its lofty perch above the namesake gas giant, Crusader Industries now deploys its wares on microTech. Try out a capable vehicle to explore the frozen landscape, sample armored options to tame uncharted wastes, and command a vessel to transport them all as Tumbril joins in the festivities for Day 4:</p><p><strong>CRUSADER INDUSTRIES</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/spirit/A1-Spirit" rel="noopener noreferrer" target="_blank"><strong>Crusader A1 Spirit</strong></a>&#160;- A mid-size multi-purpose starship equipped as a light bomber but has the cargo and weaponry to deal with many different scenarios.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-starlifter/A2-Hercules" rel="noopener noreferrer" target="_blank"><strong><u>Crusader A2 Hercules</u></strong></a>&#160;- With more than double the firepower of the M2, and a custom bomb bay capable of delivering a staggering payload, the A2 caters to anyone hauling massive amounts of cargo through potentially unfriendly skies.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-ares/Ares-Ion" rel="noopener noreferrer" target="_blank"><strong><u>Crusader Ares Ion</u></strong></a>&#160;- This single cannon equipped heavy fighter delivers extremely powerful shots to quickly disable the shields of even the biggest enemy vessels.&#160;</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-ares/Ares-Inferno" rel="noopener noreferrer" target="_blank"><strong><u>Crusader Ares Inferno</u></strong></a>&#160;- Whether heading up a crew or hunting big ships solo, the Ares Inferno's massive Gatling tears through gunship armor and turns smaller fighters to dust in seconds.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/spirit/C1-Spirit" rel="noopener noreferrer" target="_blank"><strong>Crusader C1 Spirit</strong></a>&#160;- A mid-size multi-purpose starship built for cargo transport and delivery but packing enough versatility to tackle multiple roles and unpredictable jobs.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-starlifter/C2-Hercules" rel="noopener noreferrer" target="_blank"><strong><u>Crusader C2 Hercules</u></strong></a>&#160;- Utilizing the patented Hercules military-grade spaceframe and expanding cargo capacity, while sacrificing barely any firepower, the C2 has become the cargo industry standard.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/intrepid/Intrepid" rel="noopener noreferrer" target="_blank"><strong>Crusader Intrepid</strong></a> - Versatile starter ship and light hauler built with true Crusader quality.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-starlifter/M2-Hercules" rel="noopener noreferrer" target="_blank"><strong><u>Crusader M2 Hercules</u></strong></a>&#160;- As the UEE's premier tactical Starlifter, the M2’s potent combination of capacity, maneuverability, and durability make it the obvious choice in large-scale transport.&#160;</li><li><a href="https://robertsspaceindustries.com/pledge/ships/crusader-mercury-star-runner/Mercury" rel="noopener noreferrer" target="_blank"><strong>Crusader Mercury Star Runner</strong></a>&#160;- Built with the same engineering and design principles that has made Crusader the go-to manufacturer for galactic transport on any scale, the Mercury checks all the boxes expected of a dependable courier vessel.</li></ul><p><strong>TUMBRIL LAND SYSTEMS</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone</u></strong></a>&#160;- Stir up a storm with this robust two-seater buggy that can carry a little something in the back.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone-AA" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone AA</u></strong></a>&#160;- Features EMP functionality and an anti-air missile launcher to deter threats from above.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone-MT" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone MT</u></strong></a>&#160;- Building on the agile off-road platform of the base variant, the MT adds two surface-to-air missile launchers and a ballistic cannon to keep airborne assailants at bay.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone-RC" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone RC</u></strong></a>&#160;- Cyclone racing variant. It’s red, fast, and equipped with a built-in nitro booster.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone-RN" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone RN</u></strong></a>&#160;- Built to clear the fog of war, the recon variant of the Cyclone features a powerful scanner array.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cyclone/Cyclone-TR" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Cyclone TR</u></strong></a>&#160;- Support infantry with this combat buggy. Equipped with a mounted turret to provide cover fire for ground operations.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/nova-tank/Nova" rel="noopener noreferrer" target="_blank"><strong><u>Tumbril Nova</u></strong></a>&#160;- This heavy tank offers a devastating combination of weaponry to eliminate threats on the ground and in the air.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/storm/Storm" rel="noopener noreferrer" target="_blank"><strong>Tumbril Storm</strong></a>&#160;- The Tumbril Storm single-operator mini-tank is built to blitz battlefields and take out enemy artillery.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/storm/Storm-AA" rel="noopener noreferrer" target="_blank"><strong>Tumbril Storm AA</strong></a>&#160;- Blitz overcrowded battlefields, take out threats from the air, and turn the tide of any conflict.&#160;</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="d3c8782f" data-plugin_key="plugin_trblt_banner_advanced" data-position="10"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/7ecbffadd722b44627062eedf1d1e39c344a2bae/resize(3000,1286,cover,crop(3641, oFjResjkTbagHdC7CRvYX2nNTNhDvYesFVGSNaa))/85/ironclad2026.webp&quot;,&quot;tablet&quot;:&quot;/i/521310e192e096a219727cda7c07bf5ee88bc56d/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkTbagHdC7CRvYX2nNTNhDvYesFVGSNaa))/85/ironclad2026.webp&quot;,&quot;mobile&quot;:&quot;/i/3b5a21d51c7a02df01cb38239da9d90c81a2bdf1/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkTbagHdC7CRvYX2nNTNhDvYesFVGSNaa))/85/ironclad2026.webp&quot;,&quot;max&quot;:&quot;/i/28859adabdf6a5a0f2197eea7daefe3028dac652/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjkTbagHdC7CRvYX2nNTNhDvYesFVGSNaa/ironclad2026.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Ironclad2026&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="71cf4a80" data-plugin_key="plugin_trblt_features" data-position="11"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">Drake Interplanetary</template><template slot="subtitle">Day 5, November 17-18</template><template slot="introduction"><p>Ready to get your hands dirty? Whether you're looking for the proven results of the Vulture and Caterpillar or itching for a brawl in a no-frills fighter, Drake gives the power back to the people who get things done. Check out their roster for Day 5 below:</p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-buccaneer/Buccaneer" rel="noopener noreferrer" target="_blank"><strong><u>Drake Buccaneer</u></strong></a>&#160;- A light fighter that sacrifices durability (and its ejection seat!) for raw firepower.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-caterpillar/Caterpillar" rel="noopener noreferrer" target="_blank"><strong><u>Drake Caterpillar</u></strong></a>&#160;- A heavy multi-crew commercial freighter. Lightly armed with superior cargo capacity.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/clipper/Clipper" rel="noopener noreferrer" target="_blank"><strong>Drake Clipper</strong></a> - Depend only on yourself. The Drake Clipper embodies the unbreakable spirit of the lone wanderer, with everything a solo pilot needs to thrive in the harshest corners of the galaxy.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-corsair/Corsair" rel="noopener noreferrer" target="_blank"><strong>Drake Corsair</strong></a>&#160;- A worthy exploration companion, supporting you in battle, discovery, and delivery, wherever the winds of adventure may steer you.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-cutlass/Cutlass-Black" rel="noopener noreferrer" target="_blank"><strong><u>Drake Cutlass Black</u></strong></a>&#160;- Back in black, Drake’s pirate-favorite is a highly versatile ship with combat and cargo prowess.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-cutlass/Cutlass-Blue" rel="noopener noreferrer" target="_blank"><strong><u>Drake Cutlass Blue</u></strong></a>&#160;- The Cutlass Blue boasts missiles, a more powerful engine, and Durasteel holding cells in the cargo bay.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-cutlass/Cutlass-Red" rel="noopener noreferrer" target="_blank"><strong><u>Drake Cutlass Red</u></strong></a>&#160;- The Cutlass Red converts the standard cargo hold into a well-equipped medical facility, including two MedBeds.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-cutlass/Cutlass-Steel" rel="noopener noreferrer" target="_blank"><strong>Drake Cutlass Steel</strong></a>&#160;- Whoever has the guns and the personnel makes the rules. Drake has your back in both of those departments with the Cutlass Steel, featuring 18 jump seats and a wealth of firepower.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cutter/Cutter" rel="noopener noreferrer" target="_blank"><strong>Drake Cutter</strong></a>&#160;- Designed for hard-working folks of all stripes, the Cutter packs 4 SCU of cargo room and plenty of wallop into a rough and tumble, compact frame.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cutter/Cutter-Rambler" rel="noopener noreferrer" target="_blank"><strong>Drake Cutter Rambler</strong></a>&#160;- The pilot-favorite Cutter chassis outfitted for long hauls and extended engagements. Go ahead, take the scenic route.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/cutter/Cutter-Scout" rel="noopener noreferrer" target="_blank"><strong>Drake Cutter Scout</strong></a> - The Scout model comes factory-equipped with a beefed-up scanning suite that makes it perfect for pathfinding, surveying, and even reconnaissance and covert intelligence operations.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-dragonfly/Dragonfly-Black" rel="noopener noreferrer" target="_blank"><strong><u>Drake Dragonfly Black</u></strong></a>&#160;- A two-seater grav-lev bike that easily traverses rough terrain or open space.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/golem/Golem" rel="noopener noreferrer" target="_blank"><strong>Drake Golem</strong></a> - An accessible tool built to end the corporate monopoly on mining and place your future firmly within your grasp. Focused and highly capable yet accessible to all, it’s the ideal entry into deep-space mining.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/golem/Golem-OX" rel="noopener noreferrer" target="_blank"><strong>Drake Golem OX</strong></a> - Disrupt the hauling industry with Drake. The OX is built on the proven Golem chassis but outfitted for pure freight, with generous cargo storage and integrated tractor beam.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/herald/Herald" rel="noopener noreferrer" target="_blank"><strong><u>Drake Herald</u></strong></a>&#160;- No secret is safe. Drake’s Herald captures and stores information before leaving at blistering speed.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/ironclad/Ironclad" rel="noopener noreferrer" target="_blank"><strong>Drake Ironclad</strong></a> - Run the skies with Drake’s juggernaut of free enterprise, the mighty Ironclad. An armored freighter designed to take the risks involved in deep space traversal and transport seriously, it stands as a beacon for intrepid independent pioneers across the galaxy.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/ironclad/Ironclad-Assault" rel="noopener noreferrer" target="_blank"><strong>Drake Ironclad Assault</strong></a> - Drake’s stalwart Heavy Freighter, outfitted for combat and vehicle transport. Within its huge cargo hold, the Ironclad Assault features a repair and refuel bay to keep your fleet ready for action.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mule/Mule" rel="noopener noreferrer" target="_blank"><strong>Drake Mule</strong></a>&#160;- Whether you need to transport cargo over the roughest terrain possible or load it onto larger vessels and cargo decks, the Mule works, plain and simple.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/pitbull/Pitbull" rel="noopener noreferrer" target="_blank"><strong>Drake Pitbull</strong></a> - A small-but-mighty Snub Fighter that excels at close-combat dogfighting. Whether scouting dangerous locations or swarming larger foes from a carrier, the unassuming Drake Pitbull is no bark but all bite.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/drake-vulture/Vulture" rel="noopener noreferrer" target="_blank"><strong>Drake Vulture</strong></a>&#160;- Rip wrecks like a pro and carve out your own place in the great big empty behind the stick of this rough, rugged salvage machine from Drake Interplanetary.</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="997d2e0b" data-plugin_key="plugin_trblt_banner_advanced" data-position="12"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/34ae2f61d17b7acdaf1faf3534d22f6e077a85a4/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.png&quot;,&quot;tablet&quot;:&quot;/i/2e07bbf94e66835727c72e4b14c351b6cb4c55f6/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.png&quot;,&quot;mobile&quot;:&quot;/i/fd1ee27aab4d9a4b2273f996221c9578ad785dd6/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.png&quot;,&quot;max&quot;:&quot;/i/a0250bcd1762e0e0926a4ddd0dcf2447b71228ac/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W/basher.png&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/34ae2f61d17b7acdaf1faf3534d22f6e077a85a4/resize(3000,1286,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;tablet&quot;:&quot;/i/2e07bbf94e66835727c72e4b14c351b6cb4c55f6/resize(1500,643,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;mobile&quot;:&quot;/i/fd1ee27aab4d9a4b2273f996221c9578ad785dd6/resize(1000,1778,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;max&quot;:&quot;/i/a0250bcd1762e0e0926a4ddd0dcf2447b71228ac/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W/basher.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/0c3ba706cffd5e6909c2550bc5f8e281cdcf06a3/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;tablet&quot;:&quot;/i/0c3ba706cffd5e6909c2550bc5f8e281cdcf06a3/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;mobile&quot;:&quot;/i/5cb47f8f6d40446ca3d141caf37050973bdf2517/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W))/85/basher.webp&quot;,&quot;max&quot;:&quot;/i/a0250bcd1762e0e0926a4ddd0dcf2447b71228ac/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResf1HJP5vD3RFVT6xFk8LzuovFntPEHqW8W/basher.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Basher&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="4bbed4bc" data-plugin_key="plugin_trblt_features" data-position="13"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">ARGO Astronautics, Consolidated Outland, Greycat Industrial, Grey's Market</template><template slot="subtitle">Day 6, November 18-19</template><template slot="introduction"><p>With something for just about everyone, Day 6 brings a wide array of manufacturers to IAE. Check out a variety of ships and vehicles to support industrial professions, harness a fighter that's more than the sum of its repurposed parts, or take a powered walk on the wild side. Here’s the full lineup for Day 6:</p><p><strong>ARGO ASTRONAUTICS</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/atls/ATLS" rel="noopener noreferrer" target="_blank"><strong>Argo ATLS</strong></a> - The ATLS power suit lets you tackle big jobs without the fuss of a vehicle. The specially designed exoframe uses a patented structural support system.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/atls/ATLS-GEO" rel="noopener noreferrer" target="_blank"><strong>Argo ATLS GEO</strong></a> - Built on the proven ATLS power suit chassis, the GEO is outfitted with bespoke mining components and a Jump Pack to open up the most inaccessible (and prosperous) corners of the galaxy.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/csv/CSV-SM" rel="noopener noreferrer" target="_blank"><strong>Argo CSV-SM</strong></a> - Rugged, reliable, and typically Argo, the CSV-SM gives you the power to move essential cargo anywhere, whatever the terrain.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/argo-mole/Mole" rel="noopener noreferrer" target="_blank"><strong><u>Argo MOLE</u></strong></a>&#160;- Tap into your crew’s full potential with the combined force of Argo’s patented tri-lateral mining system.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/moth/MOTH" rel="noopener noreferrer" target="_blank"><strong>Argo MOTH</strong></a> - Expand your salvage operation with the Multi Operator Targeted Harvester. Built for crews of up to four, it empowers users with Argo’s trademark strength and grit, letting you take on much bigger jobs for much bigger rewards.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/argo/MPUV-Cargo" rel="noopener noreferrer" target="_blank"><strong><u>Argo MPUV Cargo</u></strong></a>&#160;- A small, unarmed utility runabout designed for shuttling cargo.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/argo/MPUV-Personnel" rel="noopener noreferrer" target="_blank"><strong><u>Argo MPUV Personnel</u></strong></a>&#160;- A compact utility shuttle built for moving personnel.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/argo/MPUV-Tractor" rel="noopener noreferrer" target="_blank"><strong>Argo MPUV Tractor</strong></a> - The MPUV Tractor features dual tractor beams for effortless cargo handling alongside the sturdy, reliable design you expect from Argo.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/raft/RAFT" rel="noopener noreferrer" target="_blank"><strong>Argo RAFT</strong></a>&#160;- Perfect for entry-level haulers and old pros alike, the RAFT is an ideal solution for reliable local freight transport.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/argo-srv/SRV" rel="noopener noreferrer" target="_blank"><strong>Argo SRV</strong></a>&#160;- From simple freight and cargo towing to harrowing search-and-rescue operations, the SRV handles whatever you can throw at it.</li></ul><p><strong>CONSOLIDATED OUTLAND</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/hoverquad/HoverQuad" rel="noopener noreferrer" target="_blank"><strong>CNOU HoverQuad</strong></a>&#160;- You know that place where the roads end, and sky runs out? That’s HoverQuad country, and it’s begging to be explored.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mustang/Mustang-Alpha" rel="noopener noreferrer" target="_blank"><strong><u>CNOU Mustang Alpha</u></strong></a>&#160;- Consolidated Outland’s premier ship for those wanting to push the limits a little further when starting out.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mustang/Mustang-Beta" rel="noopener noreferrer" target="_blank"><strong><u>CNOU Mustang Beta</u></strong></a>&#160;- Home is where the heart is. The Beta offers comfortable living quarters for beginners roaming the frontier.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mustang/Mustang-Gamma" rel="noopener noreferrer" target="_blank"><strong><u>CNOU Mustang Gamma</u></strong></a>&#160;- An additional engine provides racers the competitive edge they need.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mustang/Mustang-Delta" rel="noopener noreferrer" target="_blank"><strong><u>CNOU Mustang Delta</u></strong></a>&#160;- The Mustang Delta is armed with heavier weapons and rocket pods to give new pilots a little more firepower.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/nomad/Nomad" rel="noopener noreferrer" target="_blank"><strong><u>CNOU Nomad</u></strong></a>&#160;- The Nomad is ready to go anywhere and do anything - the perfect solution for anyone yearning to start a brand-new adventure.</li></ul><p><strong>GREYCAT INDUSTRIAL</strong></p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/mdc/MDC" rel="noopener noreferrer" target="_blank"><strong>Greycat MDC</strong></a> - Explore in safety and keep your planetside interests secure with the Greycat Mobile Defense Centre. Equipped with an automatic anti-air cannon, it handles skyborne threats so you don’t have to.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/mtc/MTC" rel="noopener noreferrer" target="_blank"><strong>Greycat MTC</strong></a> - The MTC is perfect for carrying weapons and armor to battlefields, bunkers, outposts, expedition sites, and more.</li><li><a href="https://robertsspaceindustries.com/pledge/Standalone-Ships/PTV-Buggy" rel="noopener noreferrer" target="_blank"><strong><u>Greycat PTV</u></strong></a>&#160;- The Greycat PTV buggy gets you from point to point, wherever you are.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/roc/ROC" rel="noopener noreferrer" target="_blank"><strong><u>Greycat ROC</u></strong></a>&#160;- Designed to be as hard-working and versatile as the miners who use it.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/roc/ROC-DS" rel="noopener noreferrer" target="_blank"><strong><u>Greycat ROC-DS</u></strong></a>&#160;- With more than double the ore capacity of the standard ROC, and a dedicated boom seat for manual laser operation, the ROC-DS makes big jobs manageable.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/stv/STV" rel="noopener noreferrer" target="_blank"><strong>Greycat STV</strong></a>&#160;- A sports vehicle built by pros for pros that takes the industry-proven usability of Greycat and opens the door to adventure.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/utv/UTV" rel="noopener noreferrer" target="_blank"><strong>Greycat UTV</strong></a> - Deliver and explore anywhere with the galaxy-renowned utility of Greycat Industrial. Built with functionality as its priority, the UTV is your most trustworthy companion on every planetside excursion.</li></ul><p><strong>﻿GREY'S MARKET</strong></p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/basher/Basher" rel="noopener noreferrer" target="_blank"><strong>Grey's Market Basher</strong></a> - Grey's doesn’t comply, it defies. Smash, strike, and strafe through the black in a light fighter built from your favorite parts.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/shiv/Shiv" rel="noopener noreferrer" target="_blank"><strong>Grey's Market Shiv</strong></a> - Don't ask how we got it, don't ask where it came from, just ask, "Do you want it?"</li></ul></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="73a44665" data-plugin_key="plugin_trblt_banner_advanced" data-position="14"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:false}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desk 1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseoXeAKiJfa34taDLfYtAppydx6p6up4P8))/85/stingray.webp&quot;,&quot;tablet&quot;:&quot;/i/5f60f1a57378ab91798823df94aadef359a84e7f/resize(4,14,cover,crop(3641,1560,244,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseoXeAKiJfa34taDLfYtAppydx6p6up4P8))/85/stingray.webp&quot;,&quot;mobile&quot;:&quot;/i/317e4990a28e4b4315cbea2c9a5c2a1b51a58b1b/resize(4,57,cover,crop(1152,2048,0,1244,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseoXeAKiJfa34taDLfYtAppydx6p6up4P8))/85/stingray.webp&quot;,&quot;max&quot;:&quot;/i/4001dd23d7ebf4e881afae895eb63b1b616afd8b/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseoXeAKiJfa34taDLfYtAppydx6p6up4P8/stingray.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Stingray&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div data-arrangement_key="arrangementC" class="turbo-anchor" id="540d952f" data-plugin_key="plugin_trblt_features" data-position="15"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementC" :is-image-action-declared="true" :is-header-declared="true" v-cloak=""><template slot="title">MISC, Mirai, Kruger Intergalactic</template><template slot="subtitle">Day 7, November 19-20</template><template slot="introduction"><p>The workhorse Hull and Freelancer series are ubiquitous throughout the 'verse. Mirai's cutting-edge designs set the standard for performance, and the sleek aesthetics of ships like the exotic Stingray turn heads at every spaceport. The full lineups from MISC, Mirai, and Kruger are available to try on Day 7:</p><p><strong>MUSASHI INDUSTRIAL AND STARFLIGHT CONCERN</strong></p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/fortune/Fortune" rel="noopener noreferrer" target="_blank"><strong>MISC Fortune</strong></a> - Get the job done quickly with MISC’s most efficient salvager yet. It’s not a simple job, but the Fortune makes it easier.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-freelancer/Freelancer" rel="noopener noreferrer" target="_blank"><strong><u>MISC Freelancer</u></strong></a>&#160;- A multi-crew freighter with a turret and ordnance to deter those after its haul.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-freelancer/Freelancer-DUR" rel="noopener noreferrer" target="_blank"><strong><u>MISC Freelancer DUR</u></strong></a>&#160;- The Freelancer DUR specializes in exploration with improved scanner, jump drive, and fuel tanks.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-freelancer/Freelancer-MAX" rel="noopener noreferrer" target="_blank"><strong><u>MISC Freelancer MAX</u></strong></a>&#160;- The Freelancer MAX is for pilots who prize increased cargo capacity over everything else.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-freelancer/Freelancer-MIS" rel="noopener noreferrer" target="_blank"><strong><u>MISC Freelancer MIS</u></strong></a>&#160;- The Freelancer MIS is a limited-edition militarized variant of the classic merchant ship.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/hull/Hull-A" rel="noopener noreferrer" target="_blank"><strong>MISC Hull A</strong></a>&#160;- Where the others trade cargo capacity for firepower or speed, the Hull A is 100% on-mission transport.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/hull/Hull-B" rel="noopener noreferrer" target="_blank"><strong>MISC Hull B</strong></a> - With a huge payload and MISC’s trademark collapsible cargo system, the Hull B is built for serious haulers and delivery outfits looking to take their business to the next level and beyond.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/hull/Hull-C" rel="noopener noreferrer" target="_blank"><strong>MISC Hull C</strong></a>&#160;- Often called the most common ship in the galaxy, the Hull C cargo vessel is the most-produced of the range and is considered by many to be the most versatile.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-prospector/Prospector" rel="noopener noreferrer" target="_blank"><strong><u>MISC Prospector</u></strong></a>&#160;- A miner’s best friend, with a powerful laser and saddlebags to turn minerals to profit.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/reliant/Reliant-Kore" rel="noopener noreferrer" target="_blank"><strong><u>MISC Reliant Kore</u></strong></a>&#160;- A fusion of Xi’an and Human technology, this light freighter lets you haul cargo with a friend.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/reliant/Reliant-Mako" rel="noopener noreferrer" target="_blank"><strong><u>MISC Reliant Mako</u></strong></a>&#160;- Go where the news is and capture every moment with turret-mounted optics.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/reliant/Reliant-Sen" rel="noopener noreferrer" target="_blank"><strong><u>MISC Reliant Sen</u></strong></a>&#160;- The Reliant Sen is a versatile mobile science platform.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/reliant/Reliant-Tana" rel="noopener noreferrer" target="_blank"><strong><u>MISC Reliant Tana</u></strong></a>&#160;- An easy to maintain, versatile, lightweight fighter.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-starfarer/Starfarer" rel="noopener noreferrer" target="_blank"><strong><u>MISC Starfarer</u></strong></a>&#160;- The dedicated fuel refining platform from MISC.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/misc-starfarer/Starfarer-Gemini" rel="noopener noreferrer" target="_blank"><strong><u>MISC Starfarer Gemini</u></strong></a>&#160;- This military variant sacrifices fuel capacity for armor and a missile launcher.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/starlancer/Starlancer-MAX" rel="noopener noreferrer" target="_blank"><strong>MISC Starlancer MAX</strong></a> - Designed to carry huge payloads, the Starlancer MAX allows you to go big with a massively expansive cargo deck.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/starlancer/Starlancer-TAC" rel="noopener noreferrer" target="_blank"><strong>MISC Starlancer TAC</strong></a> - Heavy weaponry, a dedicated snub hangar, medbeds, and eight military-spec jump seats mean you’re ready for anything.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/starlite/Starlite" rel="noopener noreferrer" target="_blank"><strong>MISC Starlite</strong></a> - Refuelers are the unsung heroes of the Empire, and they demand a ship that’s as focused as they are. Whether supporting fleets or rescuing stranded citizens, the MISC Starlite is the perfect entry for solo pilots striving to make a difference.</li></ul><p><strong>MIRAI</strong></p><ul><li><a href="https://robertsspaceindustries.com/pledge/ships/fury/Fury" rel="noopener noreferrer" target="_blank"><strong>Mirai Fury</strong></a> - Shatter the limits of performance with this next-generation snub fighter from Mirai featuring four halo-mounted size 2 laser repeaters, best-in-class maneuverability, and unprecedented integration of Xi’an tech.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/fury/Fury-LX" rel="noopener noreferrer" target="_blank"><strong>Mirai Fury LX</strong></a> - The next-generation Fury LX racing ship from Mirai switches out the lithe ship’s offensive capabilities to make room for additional maneuvering thrusters perfect for getting across the finish line.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/fury/Fury-MX" rel="noopener noreferrer" target="_blank"><strong>Mirai Fury MX</strong></a> - A ruthlessly efficient snub-bomber packing an intimidating payload that’s capable of delivering it with deadly precision.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/guardian/Guardian" rel="noopener noreferrer" target="_blank"><strong>Mirai Guardian</strong></a> - Single-operator, long-range heavy fighter with a focus on raw firepower and precision.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/guardian/Guardian-QI" rel="noopener noreferrer" target="_blank"><strong>Mirai Guardian QI</strong></a> - Single-operator fighter-interceptor with a focus on raw firepower and precision.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/guardian/Guardian-MX" rel="noopener noreferrer" target="_blank"><strong>Mirai Guardian MX</strong></a> - Mirai’s already deadly Guardian, tuned for uncompromised combat performance with harder-hitting weapons and heavier defense.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mirai-pulse/Pulse" rel="noopener noreferrer" target="_blank"><strong>Mirai Pulse</strong></a> - Redefines the hoverbike experience with its fusion of sleek design, integrated weaponry, and advanced thrusters for unmatched maneuverability.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/mirai-pulse/Pulse-LX" rel="noopener noreferrer" target="_blank"><strong>Mirai Pulse LX</strong></a> - The leader of high-speed thrills. Engineered to dominate, the LX strips away weight and cuts drag, thrusting you to the forefront of every race.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/razor/Razor" rel="noopener noreferrer" target="_blank"><strong><u>Mirai Razor</u></strong></a> - Cutting ahead of the competition, this sleek racer gives anyone a run for pole position.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/razor/Razor-EX" rel="noopener noreferrer" target="_blank"><strong><u>Mirai Razor EX</u></strong></a> - Stealth-edition of the Razor outfitted with signature-reducing materials and low-draw components.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/razor/Razor-LX" rel="noopener noreferrer" target="_blank"><strong><u>Mirai Razor LX</u></strong></a> - Special-edition of the Razor features reduced maneuverability and armament in exchange for extreme straight-line speed.</li></ul><p><strong>KRUGER INTERGALACTIC</strong></p><ul><li><a href="https://robertsspaceindustries.com/en/pledge/ships/wolf/L-21-Wolf" rel="noopener noreferrer" target="_blank"><strong>Kruger L-21 Wolf</strong></a> - A combat ship prioritizing quality and agility in a timeless design that encompasses Kruger Intergalactic’s core tenet - Perfection in Every Piece.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/wolf/L-22-Alpha-Wolf" rel="noopener noreferrer" target="_blank"><strong>Kruger L-22 Alpha Wolf</strong></a> - Kruger’s modern classic Wolf, tweaked for a new audience, with bespoke laser repeaters, upgraded missiles, and a new winglet makeover.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/p52-merlin/P-52-Merlin" rel="noopener noreferrer" target="_blank"><strong><u>Kruger P-52 Merlin</u></strong></a>&#160;- Small, agile, and with a sting in its tail. This snub fighter is fragile but difficult to hit.</li><li><a href="https://robertsspaceindustries.com/pledge/ships/p72-archimedes/p-72-archimedes" rel="noopener noreferrer" target="_blank"><strong><u>Kruger P-72 Archimedes</u></strong></a>&#160;- The Archimedes delivers exceptional handling and boost capabilities in a beautifully designed package.</li><li><a href="https://robertsspaceindustries.com/en/pledge/ships/s-65-stingray/S-65-Stingray" rel="noopener noreferrer" target="_blank"><strong>Kruger S-65 Stingray</strong></a> - Kruger continues to expand its stunning lineup with its first Medium Fighter. Building on the brand’s signature use of concealed weapons, the S-65 Stingray effortlessly transforms between the compact Landed, streamlined Flight, and dogfight-ready Combat modes.</li></ul><p><br></p></template></g-features><div data-arrangement_key="full-width" class="turbo-anchor" id="72e82a10" data-plugin_
